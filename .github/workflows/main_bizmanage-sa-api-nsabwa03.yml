name: Test and deploy BizManage SA API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bizmanage-api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Keep production dependencies
        run: npm prune --omit=dev

      - name: Package backend
        run: |
          zip -qr ../backend-deploy.zip . \
            -x '.env' '.env.*' \
            '*firebase-adminsdk*.json' \
            '*.before-*'

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-deploy.zip
          retention-days: 3
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AB29B16C2EC24984B03913E7E5663E41 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_617F4F679CC34AAA9904B46E7A9D4B69 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C4F381AB0DE4EDB80E96722954F2A58 }}

      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: bizmanage-sa-api-nsabwa03
          slot-name: Production
          package: backend-deploy.zip
          startup-command: npm start
